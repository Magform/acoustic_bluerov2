services:
  acoustic-bluerov:
    container_name: acoustic-bluerov
    build:
      context: .
      dockerfile: Dockerfile
    image: acoustic-bluerov_img
    stdin_open: true
    tty: true
    privileged: true # required for /dev/input (keyboard) access
    environment:
      DISPLAY: "${DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: "xcb"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/input:/dev/input:rw
      - ./../:/root/ros2_ws/src/acoustic_bluerov2
